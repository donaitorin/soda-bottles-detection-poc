# Settings for Stage 4 (src/evaluation, scripts/predict_val.py, scripts/evaluate_detections.py, scripts/stage4_error_look.py).
# The val labels are Grounding DINO pseudo-labels: every number is AGREEMENT with Grounding DINO, not accuracy.
seed: 0
split: val                                   # test is NOT touched before Stage 8
prelabel_config: configs/prelabel.yaml       # frcnn settings, frozen Grounding DINO settings, filters and the 1.5% height floor
gt: data/annotations/coco/val.json           # from scripts/export_coco.py
predictions_dir: data/predictions/stage4     # gitignored
frcnn_score_threshold_for_map: 0.05          # low on purpose: mAP needs the whole precision-recall curve
iou_for_precision_recall: 0.5
max_dets: 300                                # dense shelves hold up to ~125 boxes; the COCO default (100) would truncate them
bootstrap: {n: 1000, level: 0.95}            # resampling of WHOLE STORES
# operating_threshold: the score at which precision / recall / F1 are reported (0.30 = the Faster R-CNN point of Stage 2).
runs:                                        # name, prediction file and variant produced by scripts/predict_val.py
  - {name: frcnn_raw,      file: frcnn_val.json, variant: raw,      baseline: true,  operating_threshold: 0.30, label: "Faster R-CNN COCO, raw output"}
  - {name: frcnn_filtered, file: frcnn_val.json, variant: filtered, baseline: true,  operating_threshold: 0.30, label: "Faster R-CNN COCO + Stage 2 filters"}
  - {name: dino_check,     file: dino_val.json,  variant: frozen,   baseline: false, operating_threshold: 0.0,  label: "Grounding DINO frozen (pipeline sanity check, NOT a baseline)"}
density_bins: 3                              # photos split into this many bins by number of pseudo-label boxes
error_look:
  output_dir: data/review/stage4_errors      # gitignored
  run: frcnn_filtered
  n_photos: 6                                # seeded random val photos, plus the ones in `include`
  include: [s06_b8c050ce, s03_05caed03, s01_d1a8951b]   # the can-only val photo and the two photos with the most extra boxes
  max_side_px: 1100
