# Settings for Stage 6a: the val crop sample (the yardstick), the crop labeling project and the catalog photo folder.
# Crops are cut from the Grounding DINO pseudo-label boxes of val. The owner labels them WITHOUT suggestions.
seed: 0
# The target list was reduced to 6 products for the tests (owner decision). Everything else is `unknown`: Pepsi, Sprite Zero, and the
# returnable versions of Zero, Sprite and Fanta. The removed ids are out of scope (not "low data").
products: [coca_classic, coca_classic_returnable, coca_zero, coca_light, sprite, fanta]
other_labels: [unknown, not_a_bottle, cannot_tell]   # unknown = another brand, water, juice; not_a_bottle = can, carton, fragment or any pseudo-label error
brands: {coca_classic: coca, coca_classic_returnable: coca, coca_zero: coca, coca_light: coca, sprite: sprite, fanta: fanta}   # Fanta is its own brand
crops:
  coco: data/annotations/coco/val.json         # from scripts/export_coco.py
  margin: 0.10                                 # each side, as a share of the box width / height
  sample:
    name: val_sample
    n: 180                                     # about 150 to 200 crops
    min_per_store: 15
    max_per_photo: 8
  images_dir: data/labelstudio/crops           # gitignored; crop images named <crop id>.jpg
  context_dir: data/labelstudio/crops/context  # gitignored; the photo with the box drawn, named <crop id>.jpg
  mapping_dir: data/crops                      # gitignored; <name>/mapping.csv and <name>/tasks.json
  display_min_long_side_px: 480                # small crops are upscaled for DISPLAY only (embeddings use the original pixels)
  display_max_long_side_px: 900
  context_long_side_px: 700
label_studio:
  url_prefix: /data/local-files/?d=labelstudio/crops/
  context_prefix: /data/local-files/?d=labelstudio/crops/context/
  from_name: product
  to_name: crop
labels_export:
  output_dir: data/annotations/crop_labels     # gitignored
  backup_dir: data/annotations/crop_ls_backups # gitignored
  min_unknown_warning: 40                      # fewer unknown crops than this: add a targeted batch
catalog:
  photos_dir: data/catalog/product_photos      # gitignored; <product id>/<product id>_NN.<ext> and sources.csv
  sources_csv: data/catalog/product_photos/sources.csv
  image_extensions: [.jpg, .jpeg, .png, .webp]
  target_per_product: 5
  min_per_product: 3
  min_short_side_px: 300
  required_columns: [file, product_id, source_url, license, uruguay_packaging_checked]
  crop:                                        # scripts/crop_catalog_photos.py: each photo holds ONE bottle on a plain background
    prompt_config: configs/prelabel.yaml       # frozen Grounding DINO (prompt, thresholds); NO Stage 2 filters: a single bottle fills much of the photo and the "oversized" filter would drop it
    margin: 0.10                               # same margin as the shelf crops
    crops_dir: data/catalog/crops              # gitignored; <product id>/<same file name>
    review_dir: data/review/catalog_crops      # gitignored; contact sheet of all crops
    several_boxes: largest                     # more than one box = almost surely fragments of the same bottle: use the largest box, and list the photo
    no_box: whole_photo                        # no box: use the whole photo, and list the photo
    contact_sheet: {cell_px: 260}
    overrides: {"fanta/fanta_01.jpg": enclosing}   # the 2 boxes are the bottle and its base: after looking at the photo, use the box around both
  augment:                                     # for the catalog augmentations of Stage 6b (about 5 to 6 per photo, applied to the bottle crop)
    per_photo: 6
    preview_dir: data/review/catalog_augment   # gitignored; one contact sheet per product
    rotation_deg: 7                            # small rotations
    perspective_distortion: 0.12               # mild perspective
    scale: [0.85, 1.15]
    brightness: 0.25
    contrast: 0.25
    blur_sigma: [0.1, 1.2]                     # slight blur
    # NOT used, on purpose (they differ from the detector training augmentations of Stage 5):
    #   horizontal flip: it MIRRORS the label text (COCA-COLA, ZERO, RETORNABLE...), which is exactly the evidence that separates variants;
    #   hue or saturation changes: colour is one of the main cues between products (Coca-Cola red, Light silver, Fanta orange, Sprite green).
embeddings:                                     # Stage 6b: DINOv2 embeddings (src/embeddings/embed.py)
  model_id: facebook/dinov2-base                # Apache-2.0, 346 MB of weights
  revision: f9e44c814b77203eaa57a6bdbbd535f21ede1415   # pinned commit on the Hugging Face Hub
  cache_dir: models/hf_cache                    # gitignored
  image_size: 224                               # the crop is padded to a square FIRST (no centre crop: bottles are tall and a centre crop would cut off cap and base), then resized
  pad_fill: [255, 255, 255]                     # padding colour: white, like the catalog photo backgrounds
  mean: [0.485, 0.456, 0.406]                   # ImageNet statistics (what DINOv2 was trained with)
  std: [0.229, 0.224, 0.225]
  pooling: cls                                  # cls | mean (mean of the patch tokens); 768-dimension vector, L2-normalised
  batch_size: 16
  timing: {warmup_batches: 2, timed_batches: 5, batch_sizes: [1, 8, 16, 32]}
